ar por resuelto el alcance de la soberanía.',benefit:'Permite escuchar intereses diversos.',risk:'La representatividad y la autoridad final seguirían siendo objeto de disputa.'},{id:'defer',title:'Aplazar la reforma hasta el regreso del rey',summary:'Evitar cambios estructurales mientras dure la ausencia del monarca.',benefit:'Reduce la ruptura institucional inmediata.',risk:'Mantiene la incertidumbre sobre cómo gobernar durante la ausencia y quién puede decidir.'}]},pact:{title:'Segunda decisión: cómo asegurar el acuerdo',question:'Si se busca una salida de compromiso, ¿qué aspecto conviene concretar primero?',choices:[{id:'powers',title:'Precisar la distribución de poderes',summary:'Acordar qué corresponde a las Cortes, al rey y a los órganos de gobierno.',benefit:'Reduce ambigüedades institucionales.',risk:'El acuerdo puede bloquearse por desacuerdos sobre el alcance de cada poder.'},{id:'representation',title:'Ampliar el acuerdo sobre representación',summary:'Priorizar quién participa y cómo se representan los territorios de la Monarquía.',benefit:'Aborda una fuente central de legitimidad y conflicto.',risk:'Negociar la representación puede retrasar decisiones urgentes y no resolver por sí solo el reparto de poder.'}]}}}

const rubric=[{name:'Uso de evidencias históricas',levels:['No aporta evidencias.','Menciona datos sin relación clara con la decisión.','Usa alguna evidencia pertinente, con explicación limitada.','Selecciona evidencias pertinentes y las relaciona con su argumento.','Integra varias evidencias fiables, contextualizadas y bien interpretadas.']},{name:'Causas y consecuencias',levels:['No identifica relaciones causales.','Enumera consecuencias sin explicar vínculos.','Explica una relación causal sencilla.','Relaciona causas, consecuencias y condiciones históricas.','Analiza cadenas causales, límites y efectos no previstos con matices.']},{name:'Perspectivas alternativas',levels:['Ignora otras perspectivas.','Las menciona de forma superficial.','Reconoce otra perspectiva o grupo afectado.','Compara intereses y argumentos de distintas perspectivas.','Contrasta perspectivas diversas y explica sus tensiones y límites.']},{name:'Argumentación e incertidumbre',levels:['No justifica la decisión.','Expresa una preferencia sin justificarla.','Ofrece razones, pero reconoce poca incertidumbre.','Construye un argumento coherente y reconoce riesgos.','Argumenta con matices, contempla objeciones y distingue hechos de hipótesis.']}];
let state={view:'home',scenario:'cadiz',phase:0,choice:null,justification:'',secondChoice:null,reflection:'',studentName:'',studentGroup:'',teacherEmail:'',teacherTab:'guide',treeOpen:false};
const phases=['Contexto','Fuentes','Decisión','Consecuencias','Debate','Reflexión'];
function loadProgress(){try{return JSON.parse(localStorage.getItem('historiaDesdeDentro')||'{}')}catch(e){return {}}}
function saveProgress(data){try{localStorage.setItem('historiaDesdeDentro',JSON.stringify(data))}catch(e){}}
function currentScenario(){return scenarios.find(s=>s.id===state.scenario)||scenarios[0]}
function progressFor(id){return loadProgress()[id]||{}}
function setNav(active){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===active))}
function toggleMenu(){const n=document.getElementById('navlinks'),b=document.querySelector('.menu-toggle');const open=n.classList.toggle('open');b.setAttribute('aria-expanded',String(open))}
function showHome(){state.view='home';setNav('home');renderHome();window.scrollTo(0,0)}
function renderHome(){const progress=loadProgress();document.getElementById('app').innerHTML=`
<section class="hero"><div class="hero-panel"><div><div class="eyebrow">Laboratorio de decisiones históricas · 2.º Bachillerato</div><h1>El pasado no tenía una única salida.</h1><p>Entra en los dilemas de la Historia de España. Consulta las fuentes, toma una decisión y defiende tu postura con argumentos.</p><button class="btn btn-primary" onclick="startScenario('cadiz')">Explorar las Cortes de Cádiz <span aria-hidden="true">→</span></button></div><div class="hero-art" aria-hidden="true"><div class="paper"><span class="stamp">ARCHIVO · 1812</span><strong>¿Quién debe tener el poder?</strong><span>Documentos · Contexto · Decisiones</span></div></div></div></section>
<section class="section"><div class="section-head"><div><div class="overline">El archivo histórico</div><h2>Elige un escenario</h2><p>Una decisión razonada empieza por comprender el contexto.</p></div><span class="tag">1 escenario completo</span></div><div class="scenario-grid">${scenarios.map(s=>{const p=progress[s.id]||{};const done=p.completed;return `<article class="scenario-card"><div class="card-banner ${s.id}"><span class="status">${s.status}</span><span class="symbol" aria-hidden="true">${s.symbol}</span></div><div class="card-body"><div class="card-meta"><span>${s.date}</span><span>·</span><span>${s.period}</span></div><h3>${s.title}</h3><p>${s.description}</p>${s.id==='cadiz'?'<div class="progress-wrap" aria-label="Progreso del escenario"><div class="progress-fill" style="width:'+(p.phase!==undefined?Math.min(100,Math.round(((p.phase+1)/6)*100)):0)+'%"></div></div><div class="progress-text"><span>'+(done?'Escenario completado':p.phase!==undefined?'Progreso guardado':'Aún sin empezar')+'</span><span>'+(done?'100%':p.phase!==undefined?Math.round(((p.phase+1)/6)*100)+'%':'0%')+'</span></div>':''}<button class="btn ${s.id==='cadiz'?'btn-primary':'btn-secondary'}" ${s.id!=='cadiz'?'disabled':''} onclick="${s.id==='cadiz'?'startScenario(\'cadiz\')':''}">${s.id==='cadiz'?(done?'Volver al escenario':p.phase!==undefined?'Continuar simulación':'Comenzar simulación'):'Módulo pendiente'}</button></div></article>`}).join('')}</div></section>
<section class="section"><div class="section-head"><div><div class="overline">Cómo funciona</div><h2>Piensa como historiador/a</h2></div></div><div class="how-grid"><article class="how-card"><div class="step-number">01</div><h3>Investiga</h3><p>Lee el contexto y consulta fuentes documentales antes de decidir.</p></article><article class="how-card"><div class="step-number">02</div><h3>Decide y argumenta</h3><p>Escoge una alternativa, aporta evidencias y considera sus riesgos.</p></article><article class="how-card"><div class="step-number">03</div><h3>Contrasta y reflexiona</h3><p>Explora una nueva decisión y revisa tu razonamiento con una rúbrica formativa.</p></article></div></section>`;}
function startScenario(id){const s=scenarios.find(x=>x.id===id);if(!s||!s.choices.length)return;const saved=progressFor(id);state={...state,view:'scenario',scenario:id,phase:saved.completed?0:(saved.phase||0),choice:saved.choice||null,justification:saved.justification||'',secondChoice:saved.secondChoice||null,reflection:saved.reflection||'',studentName:saved.studentName||'',studentGroup:saved.studentGroup||'',teacherEmail:saved.teacherEmail||''};setNav('');renderScenario();window.scrollTo(0,0)}
function persist(){const all=loadProgress(),s=currentScenario();all[s.id]={phase:state.phase,choice:state.choice,justification:state.justification,secondChoice:state.secondChoice,reflection:state.reflection,completed:state.phase===5&&state.reflection.trim().length>=30};saveProgress(all)}
function gotoPhase(p){if(p<0||p>5)return;state.phase=p;persist();renderScenario();window.scrollTo(0,0)}
function renderScenario(){const s=currentScenario();const app=document.getElementById('app');const body=[renderContext(s),renderSources(s),renderDecision(s),renderConsequences(s),renderDebate(s),renderReflection(s)][state.phase];app.innerHTML=`<section class="view"><button class="backlink" onclick="showHome()">← Volver al archivo</button><div class="scenario-title"><div class="eyebrow">${s.date} · ${s.location}</div><h1>${s.title}</h1><p>${s.description}</p></div><div class="progress-text"><span>Progreso del escenario</span><span>Fase ${state.phase+1} de 6</span></div><div class="progress-wrap"><div class="progress-fill" style="width:${((state.phase+1)/6)*100}%"></div></div><nav class="phase-nav" aria-label="Fases del escenario">${phases.map((p,i)=>`<button class="phase-pill ${i===state.phase?'current':i<state.phase?'done':''}" ${i>state.phase?'disabled':''} onclick="gotoPhase(${i})">${i<state.phase?'✓ ':''}${i+1}. ${p}</button>`).join('')}</nav>${body}</section>`; }
function phaseActions(prev,next,label='Continuar'){return `<div class="actions">${prev>=0?'<button class="btn btn-secondary" onclick="gotoPhase('+prev+')">← Anterior</button>':''}<button class="btn btn-primary" onclick="${next===3?'submitDecision()':next===5?'gotoPhase(5)':'gotoPhase('+next+')'}">${label} →</button></div>`}
function renderContext(s){return `<div class="columns"><section class="panel"><div class="overline">Fase A · Introducción histórica</div><h2>Una crisis de legitimidad</h2><p>${s.context}</p><div class="callout"><strong>Tu misión</strong><br>${s.problem}</div><h3>Actores y perspectivas</h3><ul>${s.actors.map(a=>'<li>'+a+'</li>').join('')}</ul></section><aside class="panel"><div class="overline">Línea del tiempo</div><h2>Fechas clave</h2><div class="timeline">${s.timeline.map(t=>'<div class="timeline-item"><strong>'+t[0]+'</strong><span>'+t[1]+'</span></div>').join('')}</div><p class="small muted">Recuerda: las decisiones de la simulación son hipotéticas. No alteran los hechos históricos documentados.</p>${phaseActions(-1,1,'Consultar fuentes')}</aside></div>`}
function renderSources(s){return `<section class="panel"><div class="overline">Fase B · Dossier documental</div><h2>Antes de decidir, consulta las fuentes</h2><p class="muted">Abre los documentos que necesites. Puedes volver a esta fase durante la simulación.</p>${s.sources.map((d,i)=>`<details class="source-card" ${i===0?'open':''}><summary>${d.title}</summary><div class="source-meta"><strong>Autoría:</strong> ${d.author} · <strong>Fecha:</strong> ${d.date}<br><strong>Naturaleza:</strong> ${d.nature}<br><strong>Procedencia:</strong> ${d.origin}</div><p class="small">${d.context}</p><div class="source-text">${d.text.replace(/\n/g,'<br>')}</div></details>`).join('')}<div class="callout"><strong>Lectura crítica:</strong> ¿Quién produjo el documento, con qué propósito y qué grupos o voces podrían quedar fuera?</div>${phaseActions(0,2,'Ir al dilema')}</section>`}
function renderDecision(s){return `<section class="panel"><div class="overline">Fase C · El dilema</div><h2>¿Qué recomendarías?</h2><p>${s.problem}</p><form id="decisionForm" onsubmit="event.preventDefault();submitDecision()"><div class="choice-grid">${s.choices.map(c=>`<label class="choice"><input type="radio" name="choice" value="${c.id}" ${state.choice===c.id?'checked':''} onchange="state.choice=this.value;persist()"><strong>${c.title}</strong><span>${c.summary}</span><div class="tradeoff"><strong>Posible beneficio:</strong> ${c.benefit}</div><div class="tradeoff"><strong>Riesgo:</strong> ${c.risk}</div></label>`).join('')}</div><label class="field-label" for="justification">Defiende tu decisión</label><p class="help">Escribe al menos 80 caracteres y responde a las cuatro cuestiones. No se evalúa que coincidas con una postura concreta.</p><textarea class="textarea" id="justification" minlength="80" placeholder="1. Elijo esta alternativa porque…\n2. La evidencia histórica que respalda mi decisión es…\n3. Preveo estas consecuencias positivas y negativas…\n4. Una persona que discrepe podría argumentar que…" oninput="state.justification=this.value;persist()">${escapeHTML(state.justification)}</textarea><div id="decisionError" class="error" role="alert"></div><div class="actions"><button class="btn btn-secondary" type="button" onclick="gotoPhase(1)">← Volver a las fuentes</button><button class="btn btn-primary" type="submit">Guardar decisión y analizar →</button></div></form></section>`}
function submitDecision(){const error=document.getElementById('decisionError');if(!state.choice){if(error)error.textContent='Selecciona una alternativa antes de continuar.';else alert('Selecciona una alternativa antes de continuar.');return}if(state.justification.trim().length<80){if(error)error.textContent='Tu justificación necesita al menos 80 caracteres. Explica evidencias, consecuencias y una postura alternativa.';else alert('Completa la justificación (mínimo 80 caracteres).');return}state.phase=3;persist();renderScenario();window.scrollTo(0,0)}
function renderConsequences(s){const c=s.choices.find(x=>x.id===state.choice)||s.choices[0];const branch=s.branches[c.next];return `<div class="columns"><section class="panel"><div class="overline">Fase D · Consecuencias y nueva decisión</div><h2>Has elegido: ${c.title}</h2><p>${c.summary}</p><h3>Lectura histórica de tu elección</h3><p>${c.benefit}</p><p>${c.risk}</p><div class="callout"><span class="tag fact">Hecho documentado</span><p>Las Cortes de Cádiz aprobaron la Constitución de 1812, que formuló la soberanía nacional. Fernando VII restauró el absolutismo en 1814. Estos hechos no cambian según la opción elegida en esta actividad.</p><span class="tag hypothesis">Hipótesis de simulación</span><p>Los beneficios y riesgos descritos son posibilidades razonadas, no resultados históricos comprobados de una decisión alternativa.</p></div><p class="source-note">No es posible demostrar qué habría ocurrido si las decisiones históricas hubieran sido distintas. La simulación sirve para comparar argumentos, no para reescribir el pasado.</p></section><aside class="panel"><div class="overline">Ramificación del árbol</div><h2>${branch.title}</h2><p>${branch.question}</p><div class="choice-grid">${branch.choices.map(x=>`<label class="choice"><input type="radio" name="second" value="${x.id}" ${state.secondChoice===x.id?'checked':''} onchange="state.secondChoice=this.value;persist()"><strong>${x.title}</strong><span>${x.summary}</span><div class="tradeoff"><strong>Beneficio:</strong> ${x.benefit}</div><div class="tradeoff"><strong>Riesgo:</strong> ${x.risk}</div></label>`).join('')}</div><div id="branchError" class="error" role="alert"></div><button class="btn btn-primary" onclick="submitBranch()">Confirmar segunda decisión →</button></aside></div><div class="actions"><button class="btn btn-secondary" onclick="gotoPhase(2)">← Revisar mi decisión</button><button class="btn btn-quiet" onclick="openTree()">Ver árbol completo</button></div>`}
function submitBranch(){if(!state.secondChoice){document.getElementById('branchError').textContent='Elige una alternativa para continuar.';return}state.phase=4;persist();renderScenario();window.scrollTo(0,0)}
function renderDebate(s){const c=s.choices.find(x=>x.id===state.choice)||s.choices[0];const branch=s.branches[c.next];const b=branch.choices.find(x=>x.id===state.secondChoice)||branch.choices[0];return `<section class="panel"><div class="overline">Fase E · Debate y contraste</div><h2>Contrasta tu perspectiva</h2><p>Tu decisión priorizó: <strong>${c.title}</strong>. En la segunda decisión elegiste: <strong>${b.title}</strong>.</p><h3>Argumentos de otras perspectivas</h3><div class="how-grid"><article class="how-card"><div class="overline">A favor</div><h3>${c.title}</h3><p>${c.benefit}</p></article><article class="how-card"><div class="overline">Objeción posible</div><h3>Una postura diferente</h3><p>${c.risk} Una persona que discrepe podría priorizar otros riesgos o valores políticos.</p></article><article class="how-card"><div class="overline">Límite de la simulación</div><h3>Lo que no sabemos</h3><p>No podemos asignar con certeza resultados a una alternativa que no ocurrió. Distingue la plausibilidad de la evidencia.</p></article></div><h3 style="margin-top:25px">Preguntas para debatir en clase</h3><ol><li>¿Qué información te faltaba para decidir?</li><li>¿Qué grupos sociales se habrían beneficiado o perjudicado?</li><li>¿Qué consecuencias no habías previsto?</li><li>¿Cambiarías tu decisión tras conocer otras perspectivas?</li><li>¿Qué diferencia existe entre comprender el pasado y juzgarlo con valores actuales?</li></ol>${phaseActions(3,5,'Reflexionar sobre lo aprendido')}</section>`}
function renderReflection(s){return `<section class="panel"><div class="overline">Fase F · Reflexión final</div><h2>¿Qué has aprendido al decidir?</h2><p>Escribe una reflexión de al menos 30 caracteres. Incluye una idea que ahora entiendas mejor y algo que revisarías.</p><label class="field-label" for="reflection">Mi reflexión</label><textarea class="textarea" id="reflection" placeholder="Al comparar las alternativas, he comprendido que… La evidencia que más me ha hecho pensar es… La próxima vez…" oninput="state.reflection=this.value;persist()">${escapeHTML(state.reflection)}</textarea><div id="reflectionError" class="error" role="alert"></div><div class="actions"><button class="btn btn-secondary" onclick="gotoPhase(4)">← Volver al debate</button><button class="btn btn-primary" onclick="finishScenario()">Finalizar y ver rúbrica →</button><button class="btn btn-quiet" onclick="openTree()">Ver árbol de decisiones</button></div></section>`}
function finishScenario(){if(state.reflection.trim().length<30){document.getElementById('reflectionError').textContent='Escribe al menos 30 caracteres para completar la reflexión.';return}persist();state.view='evaluation';renderEvaluation();window.scrollTo(0,0)}
function renderEvaluation(){const s=currentScenario(),all=loadProgress();all[s.id]={...all[s.id],phase:5,completed:true};saveProgress(all);document.getElementById('app').innerHTML=`<section class="view"><button class="backlink" onclick="showHome()">← Volver al archivo</button><div class="scenario-title"><div class="eyebrow">Simulación completada</div><h1>Tu razonamiento es el punto de partida.</h1><p>La calidad histórica no consiste en adivinar una respuesta única, sino en argumentar con evidencias, reconocer perspectivas y explicar la incertidumbre.</p></div><div class="columns"><section class="panel"><div class="overline">Autoevaluación formativa</div><h2>Rúbrica de pensamiento crítico</h2><p class="muted">Selecciona un nivel para cada dimensión. Esta autoevaluación orienta la reflexión; el docente puede revisarla.</p><div id="rubricRows">${rubric.map((r,i)=>`<div style="padding:16px 0;border-bottom:1px solid var(--border)"><strong>${r.name}</strong><div style="display:flex;gap:7px;flex-wrap:wrap;margin:10px 0">${[0,1,2,3,4].map(n=>`<label class="tag" style="cursor:pointer"><input type="radio" name="rubric${i}" value="${n}" style="accent-color:var(--wine)"> ${n}</label>`).join('')}</div><p class="small muted" id="rubricDesc${i}">Elige un nivel para consultar el descriptor.</p></div>`).join('')}</div><div class="actions"><button class="btn btn-primary" onclick="scoreRubric()">Ver orientación formativa</button><button class="btn btn-secondary" onclick="generateStudentPDF()">Generar informe PDF</button><button class="btn btn-quiet" onclick="prepareTeacherEmail()">Preparar correo al docente</button></div><div id="rubricResult" aria-live="polite"></div></section><aside class="panel"><div class="overline">Entrega al docente</div><h2>Datos del alumno</h2><label class="field-label" for="studentName">Nombre y apellidos</label><input class="textarea" style="min-height:46px" id="studentName" placeholder="Tu nombre" value="${escapeHTML(state.studentName||'')}" oninput="state.studentName=this.value;persistMeta()"><label class="field-label" for="studentGroup">Curso / grupo</label><input class="textarea" style="min-height:46px" id="studentGroup" placeholder="Ej. 4.º ESO B" value="${escapeHTML(state.studentGroup||'')}" oninput="state.studentGroup=this.value;persistMeta()"><label class="field-label" for="teacherEmail">Correo del docente</label><input class="textarea" style="min-height:46px" type="email" id="teacherEmail" placeholder="docente@centro.es" value="${escapeHTML(state.teacherEmail||'')}" oninput="state.teacherEmail=this.value;persistMeta()"><p class="help">El correo se prepara en tu aplicación de email; tendrás que adjuntar el PDF guardado.</p><div class="overline" style="margin-top:24px">Tu recorrido</div><h2>Decisiones tomadas</h2><p><strong>Primera decisión:</strong><br>${(s.choices.find(c=>c.id===state.choice)||{}).title||'—'}</p><p><strong>Segunda decisión:</strong><br>${state.secondChoice||'—'}</p><h3>Tu justificación</h3><p class="small">${escapeHTML(state.justification)}</p><h3>Tu reflexión</h3><p class="small">${escapeHTML(state.reflection)}</p><div class="callout">Recuerda: ninguna postura se puntúa por su orientación política. Lo que importa es la calidad del razonamiento.</div><button class="btn btn-secondary" onclick="startScenario('cadiz')">Revisar escenario</button></aside></div></section>`}
function persistMeta(){const all=loadProgress(),s=currentScenario();all[s.id]={...all[s.id],studentName:state.studentName||'',studentGroup:state.studentGroup||'',teacherEmail:state.teacherEmail||''};saveProgress(all)}
function generateStudentPDF(){persistMeta();const s=currentScenario(),first=s.choices.find(c=>c.id===state.choice),branch=first&&s.branches[first.next],second=branch&&branch.choices.find(c=>c.id===state.secondChoice);const scores=rubric.map((r,i)=>{const e=document.querySelector('input[name="rubric'+i+'"]:checked');return '<tr><td>'+escapeHTML(r.name)+'</td><td>'+(e?e.value+'/4':'Pendiente')+'</td><td>'+(e?escapeHTML(r.levels[Number(e.value)]):'Sin completar')+'</td></tr>'}).join('');const totalEls=rubric.map((r,i)=>document.querySelector('input[name="rubric'+i+'"]:checked'));const total=totalEls.every(Boolean)?totalEls.reduce((a,e)=>a+Number(e.value),0)+' / 16':'Pendiente';const debates=['¿Qué información te faltaba para decidir?','¿Qué grupos sociales se habrían beneficiado o perjudicado?','¿Qué consecuencias no habías previsto?','¿Cambiarías tu decisión tras conocer otras perspectivas?','¿Qué diferencia existe entre comprender el pasado y juzgarlo con valores actuales?'];const w=window.open('','_blank');if(!w){alert('Permite las ventanas emergentes para generar el informe.');return}const e=escapeHTML;const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Informe de aprendizaje histórico</title><style>body{font:12pt/1.55 Arial;color:#35252A;max-width:850px;margin:30px auto;padding:0 24px}h1,h2{color:#702B3A}h2{border-bottom:1px solid #E1CFB5;padding-bottom:5px;margin-top:25px}.meta{background:#F3E8D7;padding:14px}pre{white-space:pre-wrap;font:inherit;background:#FFFCF7;border-left:3px solid #C49A6C;padding:12px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #E1CFB5;padding:8px;text-align:left;vertical-align:top}th{background:#F3E8D7}footer{border-top:1px solid #E1CFB5;margin-top:30px;padding-top:10px;font-size:9pt}@media print{body{margin:0 auto;padding:0 10mm}h2{break-after:avoid}tr,li,pre{break-inside:avoid}}</style></head><body><p>¿Y tú qué habrías hecho? · Historia de España desde dentro</p><h1>Informe de aprendizaje histórico</h1><div class="meta"><b>Escenario:</b> '+e(s.title)+' ('+e(s.date)+')<br><b>Alumno/a:</b> '+e(state.studentName||'No indicado')+'<br><b>Curso/grupo:</b> '+e(state.studentGroup||'No indicado')+'<br><b>Fecha:</b> '+new Date().toLocaleDateString('es-ES')+'</div><h2>1. Primera decisión</h2><p><b>'+e(first?first.title:'No consta')+'</b></p><p>'+e(first?first.summary:'')+'</p><h2>2. Segunda decisión</h2><p><b>'+e(second?second.title:'No consta')+'</b></p><p>'+e(second?second.summary:'')+'</p><h2>3. Justificación del alumno/a</h2><pre>'+e(state.justification||'Sin respuesta')+'</pre><h2>4. Reflexión final</h2><pre>'+e(state.reflection||'Sin respuesta')+'</pre><h2>5. Autoevaluación formativa: '+total+'</h2><table><thead><tr><th>Dimensión</th><th>Nivel</th><th>Descriptor</th></tr></thead><tbody>'+scores+'</tbody></table><p>La autoevaluación es orientativa: se valora la calidad del razonamiento, no la postura elegida.</p><h2>6. Preguntas de debate</h2><ol>'+debates.map(q=>'<li>'+e(q)+'</li>').join('')+'</ol><h2>7. Fuentes consultadas</h2><ul>'+s.sources.map(x=>'<li><b>'+e(x.title)+'</b> — '+e(x.author)+', '+e(x.date)+'. '+e(x.context)+'</li>').join('')+'</ul><p>Las consecuencias alternativas son hipótesis de simulación, no hechos históricos comprobados.</p><footer>Aplicación desarrollada en el marco del Proyecto STEAM 4.0 / Programa de Cooperación Territorial Código Escuela 4.0</footer><script>window.onload=function(){setTimeout(function(){window.print()},300)};<\/script></body></html>';w.document.open();w.document.write(html);w.document.close()}
function prepareTeacherEmail(){persistMeta();const email=document.getElementById('teacherEmail').value.trim();if(!email||!email.includes('@')){alert('Introduce un correo válido del docente.');document.getElementById('teacherEmail').focus();return}const s=currentScenario();const subject=encodeURIComponent('Informe de simulación histórica — '+(state.studentName||'Alumno/a')+' — '+s.title);const body=encodeURIComponent('Hola,\n\nAdjunto mi informe PDF de la simulación «'+s.title+'».\nAlumno/a: '+(state.studentName||'No indicado')+'\nCurso/grupo: '+(state.studentGroup||'No indicado')+'\n\nUn saludo.');window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+subject+'&body='+body;alert('Correo preparado. Guarda el informe como PDF y adjúntalo manualmente antes de enviarlo.')}
function scoreRubric(){let total=0,selected=0,notes=[];rubric.forEach((r,i)=>{const el=document.querySelector('input[name="rubric'+i+'"]:checked');const desc=document.getElementById('rubricDesc'+i);if(el){const n=Number(el.value);total+=n;selected++;desc.textContent='Nivel '+n+': '+r.levels[n]}else{desc.textContent='Selecciona un nivel para completar esta dimensión.'} });if(selected<4){document.getElementById('rubricResult').innerHTML='<p class="error">Selecciona un nivel en las cuatro dimensiones para obtener una orientación.</p>';return}rubric.forEach((r,i)=>{const n=Number(document.querySelector('input[name="rubric'+i+'"]:checked').value);if(n<3)notes.push('Para mejorar «'+r.name.toLowerCase()+'», intenta alcanzar el nivel 3: '+r.levels[3]);});document.getElementById('rubricResult').innerHTML='<div class="callout" style="margin-top:18px"><div class="score">'+total+'<span style="font-size:18px;color:var(--muted)"> / 16</span></div><h3>Orientación para seguir aprendiendo</h3><p>Esta puntuación es una autoevaluación orientativa, no un juicio automático de tu postura.</p><ul>'+(notes.length?notes.map(n=>'<li>'+escapeHTML(n)+'</li>').join(''):'<li>Has valorado positivamente las cuatro dimensiones. Sigue contrastando tus argumentos con las fuentes.</li>')+'</ul><p class="small muted">El docente puede revisar la puntuación y aportar retroalimentación adicional.</p></div>'}
function openTree(){state.view='tree';setNav('tree');renderTree();window.scrollTo(0,0)}
function renderTree(){const s=currentScenario(),chosen=s.choices.find(c=>c.id===state.choice);document.getElementById('app').innerHTML=`<section class="view"><button class="backlink" onclick="showHome()">← Volver al archivo</button><div class="section-head"><div><div class="overline">Pensamiento computacional</div><h2>Árbol de decisiones</h2><p>Observa cómo una elección determina qué pregunta aparece después.</p></div><button class="btn btn-secondary" onclick="startScenario('cadiz')">Ir a la simulación</button></div><div class="panel"><div class="tree"><div class="tree-node active"><strong>Inicio: crisis de legitimidad (1810)</strong><br><span class="small muted">La decisión inicial selecciona una rama.</span></div><div class="tree-arrow">↓</div><div class="tree-node ${state.choice==='nation'?'active':''}"><strong>Rama A · Soberanía nacional y Constitución</strong><br><span class="small">Siguiente situación: sostener el cambio</span></div><div class="tree-node ${state.choice==='crown'?'active':''}"><strong>Rama B · Autoridad tradicional del rey</strong><br><span class="small">Siguiente situación: responder a la crisis de legitimidad</span></div><div class="tree-node ${state.choice==='balance'?'active':''}"><strong>Rama C · Acuerdo constitucional limitado</strong><br><span class="small">Siguiente situación: asegurar el acuerdo</span></div><div class="tree-arrow">↓</div><div class="tree-node"><strong>Segundo nivel</strong><br><span class="small muted">Cada rama presenta dos nuevas alternativas, con beneficios y riesgos diferentes.</span></div><div class="tree-arrow">↓</div><div class="tree-node"><strong>Debate y reflexión</strong><br><span class="small muted">Se comparan perspectivas y se distingue evidencia de hipótesis.</span></div></div><div class="callout"><strong>Reglas de ramificación</strong><ol><li>La elección inicial identifica una de tres rutas (nation, crown o balance).</li><li>La ruta determina el texto y las dos opciones de la segunda decisión.</li><li>La segunda elección se guarda y el alumnado pasa al debate.</li><li>El sistema no cambia los hechos históricos documentados; las consecuencias alternativas se etiquetan como hipotéticas.</li></ol></div><h3>Actividad de pensamiento computacional</h3><p>Explica con tus palabras qué condición determina la siguiente pantalla. ¿Qué cambiarías para añadir una cuarta alternativa sin duplicar todo el escenario?</p><textarea class="textarea" id="computational" placeholder="Si la elección inicial es…, entonces…"></textarea><div class="actions"><button class="btn btn-primary" onclick="saveComputational()">Guardar explicación localmente</button></div><div id="computationalSaved" aria-live="polite"></div></div></section>`}
function saveComputational(){const val=document.getElementById('computational').value;const all=loadProgress();all.computational=val;saveProgress(all);document.getElementById('computationalSaved').innerHTML='<div class="toast">Explicación guardada en este navegador.</div>'}
function openTeacher(){state.view='teacher';setNav('teacher');renderTeacher();window.scrollTo(0,0)}
function renderTeacher(){const s=currentScenario();const tabs={guide:'Guía de sesión',sources:'Fuentes y dilema',debate:'Preguntas de debate',rubric:'Rúbrica',tree:'Árbol de decisiones'};document.getElementById('app').innerHTML=`<section class="view"><div class="section-head"><div><div class="overline">Espacio docente</div><h2>Modo profesor</h2><p>Material para proyectar, orientar el análisis y organizar el debate.</p></div><button class="btn btn-primary" onclick="startScenario('cadiz')">Proyectar escenario</button></div><div class="teacher-layout"><nav class="panel teacher-menu" aria-label="Secciones del modo profesor">${Object.entries(tabs).map(([id,label])=>'<button class="'+(state.teacherTab===id?'active':'')+'" onclick="state.teacherTab=\''+id+'\';renderTeacher()">'+label+'</button>').join('')}</nav><section class="panel">${teacherContent(s)}</section></div></section>`}
function teacherContent(s){if(state.teacherTab==='sources')return '<div class="overline">Material histórico</div><h2>Fuentes y dilema</h2>'+s.sources.map(d=>'<h3>'+d.title+'</h3><p class="small muted">'+d.author+' · '+d.date+' · '+d.nature+'</p><p>'+d.context+'</p><blockquote>'+escapeHTML(d.text)+'</blockquote>').join('')+'<h3>Alternativas</h3><ol>'+s.choices.map(c=>'<li><strong>'+c.title+'</strong>: '+c.summary+' <br><span class="small muted">Beneficio: '+c.benefit+' Riesgo: '+c.risk+'</span></li>').join('')+'</ol>';
if(state.teacherTab==='debate')return '<div class="overline">Conversación en el aula</div><h2>Preguntas para el debate</h2><ol><li>¿Qué información te faltaba para decidir?</li><li>¿Qué grupos sociales se habrían beneficiado o perjudicado?</li><li>¿Qué consecuencias no habías previsto?</li><li>¿Cambiarías tu decisión tras conocer otras perspectivas?</li><li>¿Qué diferencia existe entre comprender el pasado y juzgarlo con valores actuales?</li></ol><h3>Orientación para moderar</h3><p>Solicita que cada intervención cite una fuente o explicite cuándo formula una hipótesis. Invita a reconstruir los argumentos de una postura diferente sin caricaturizarla.</p>';
if(state.teacherTab==='rubric')return '<div class="overline">Evaluación formativa</div><h2>Rúbrica de pensamiento crítico</h2><div class="rubric-wrap"><table class="rubric"><thead><tr><th>Dimensión</th>'+[0,1,2,3,4].map(n=>'<th>Nivel '+n+'</th>').join('')+'</tr></thead><tbody>'+rubric.map(r=>'<tr><td>'+r.name+'</td>'+r.levels.map(l=>'<td>'+l+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="small muted">Máximo: 16 puntos. La evaluación debe valorar la argumentación, no la coincidencia con una postura política.</p>';
if(state.teacherTab==='tree')return '<div class="overline">Lógica de la simulación</div><h2>Ramificaciones</h2><p>La primera elección selecciona una clave de ruta: <code>nation</code>, <code>crown</code> o <code>balance</code>. Cada clave carga una pregunta distinta y dos alternativas secundarias. La segunda elección conduce al debate.</p><button class="btn btn-secondary" onclick="openTree()">Abrir visualización completa</button>';
return '<div class="overline">Propuesta didáctica</div><h2>Guía para una sesión de 50–55 minutos</h2><ol><li><strong>Activación (5 min):</strong> plantear la crisis de legitimidad de 1808 sin adelantar una respuesta.</li><li><strong>Contexto (8 min):</strong> ubicar la guerra, la ausencia del monarca y la reunión de las Cortes.</li><li><strong>Lectura documental (10 min):</strong> en parejas, identificar autoría, fecha, naturaleza y propósito de cada documento.</li><li><strong>Decisión individual (10 min):</strong> elegir una alternativa y justificarla con evidencias.</li><li><strong>Debate (15 min):</strong> comparar argumentos y analizar la segunda ramificación.</li><li><strong>Cierre (5 min):</strong> distinguir hechos documentados, interpretaciones e hipótesis contrafactuales.</li></ol><div class="callout"><strong>Cuestiones clave:</strong> soberanía nacional; legitimidad política; división de poderes; guerra y urgencia; representación de los territorios; distancia entre norma y aplicación.</div><h3>Precaución histórica</h3><p>La Constitución de 1812 y la restauración absolutista de 1814 son hechos documentados. Las consecuencias de las alternativas no adoptadas deben tratarse como hipótesis, nunca como hechos.</p><p class="small muted">No se necesita una cuenta ni conexión con servicios externos. El progreso se guarda localmente en el navegador.</p>'}
function escapeHTML(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
showHome();
</script>
